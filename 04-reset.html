<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose New Password — CreditPaper</title>
<link rel="stylesheet" href="theme.css">
<style>
  .auth-note { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 11px 14px; font-size: 11.5px; color: var(--text-2); margin-bottom: 18px; line-height: 1.6; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-left">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-mark">C</div>
        <div class="brand-name">CREDITPAPER</div>
      </div>

      <div class="card" style="box-shadow: var(--sh-3)">
        <div class="card-body" style="padding:28px">
          <h1 class="auth-title">Choose a new password</h1>
          <p class="auth-sub">This link can be used once.</p>

          <div class="field" style="margin-bottom:16px">
            <label class="label">New password</label>
            <input class="input" type="password" placeholder="Min. 10 characters">
          </div>
          <div class="field" style="margin-bottom:16px">
            <label class="label">Confirm password</label>
            <input class="input" type="password" placeholder="Re-enter your password">
          </div>

          <div class="auth-note">Signing in again will be required on your other devices.</div>

          <button class="btn btn-primary" style="width:100%;height:40px;justify-content:center">
            Update password
          </button>

          <p class="auth-note" style="margin-top:16px;margin-bottom:0">Remember your password? <b style="color:var(--accent-hover);cursor:pointer;font-weight:600" onclick="location.href='02-login.html'">Sign in</b></p>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-right-content">
      <h2>New password,<br>fresh start.</h2>
      <p>Choose something strong. We recommend a passphrase — easy to remember, hard to crack.</p>
    </div>
  </div>
</div>

</body>
</html>

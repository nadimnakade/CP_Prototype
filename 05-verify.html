<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm Email — CreditPaper</title>
<link rel="stylesheet" href="theme.css">
<style>
  .auth-page { min-height:100vh; display:grid; place-items:center; padding:40px 20px; background:var(--page); }
  .auth-card { width:100%; max-width:380px; }
  .auth-logo { display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:24px; }
  .auth-logo .brand-mark { width:30px; height:30px; font-size:14px; }
  .auth-logo .brand-name { font-size:16px; letter-spacing:-.3px; }
  .auth-title { font-size:18px; font-weight:700; margin:0 0 4px; text-align:center; }
  .auth-sub { font-size:12.5px; color:var(--text-3); text-align:center; margin:0 0 22px; }
  .auth-note { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm); padding:10px 12px; font-size:11.5px; color:var(--text-2); margin-bottom:18px; }
  .auth-link { text-align:center; margin-top:14px; font-size:11.5px; color:var(--text-3); }
  .auth-link b { color:var(--accent-hover); font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><div class="brand-mark">C</div><div class="brand-name">CREDITPAPER</div></div>
    <div class="card">
      <div class="card-body" style="padding:24px">
        <h1 class="auth-title">Confirm your email</h1>
        <p class="auth-sub">One step before we begin.</p>
        <div class="auth-note">We sent a link to <b>jordan@acmecapital.com.au</b>. Open it to continue.</div>
        <button class="btn" style="width:100%;height:38px;justify-content:center">
          Resend link <span class="muted" style="margin-left:4px">(0:42)</span>
        </button>
        <p class="auth-link">Wrong address? <b>Change it</b></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm Email — CreditPaper</title>
<link rel="stylesheet" href="theme.css">
<style>
  .auth-note { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 14px; font-size: 11.5px; color: var(--text-2); margin-bottom: 18px; line-height: 1.6; }
  .auth-link { text-align: center; margin-top: 14px; font-size: 12px; color: var(--text-3); }
  .auth-link b { color: var(--accent-hover); font-weight: 600; cursor: pointer; transition: color var(--dur-fast); }
  .auth-link b:hover { color: var(--primary); }
  .timer { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-left">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-mark">C</div>
        <div class="brand-name">CREDITPAPER</div>
      </div>

      <div class="card" style="box-shadow: var(--sh-3)">
        <div class="card-body" style="padding:28px">
          <h1 class="auth-title">Confirm your email</h1>
          <p class="auth-sub">One step before we begin.</p>

          <div class="auth-note">We sent a verification link to <b>jordan@acmecapital.com.au</b>. Open it to continue.</div>

          <button class="btn" style="width:100%;height:40px;justify-content:center">
            Resend link <span class="muted timer" style="margin-left:6px">(0:42)</span>
          </button>

          <p class="auth-link">Wrong address? <b onclick="location.href='01-signup.html'">Change it</b></p>
          <p class="auth-link" style="margin-top:8px">Already confirmed? <b onclick="location.href='02-login.html'">Sign in</b></p>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-right-content">
      <h2>Check your inbox.</h2>
      <p>Click the link in the email we just sent. It usually arrives within a minute.</p>
    </div>
  </div>
</div>

</body>
</html>

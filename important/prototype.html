<title>Creditpaper Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root{
  --background:0 0% 100%; --foreground:240 10% 3.9%;
  --card:0 0% 100%; --card-foreground:240 10% 3.9%;
  --popover:0 0% 100%;
  --primary:240 5.9% 10%; --primary-foreground:0 0% 98%;
  --secondary:240 4.8% 95.9%; --secondary-foreground:240 5.9% 10%;
  --muted:240 4.8% 95.9%; --muted-foreground:240 3.8% 46.1%;
  --accent:240 4.8% 95.9%; --accent-foreground:240 5.9% 10%;
  --destructive:0 72% 51%; --success:142 60% 34%; --warning:32 85% 44%; --info:221 70% 50%;
  --border:240 5.9% 90%; --input:240 5.9% 90%; --ring:240 5.9% 10%;
  --radius:.5rem;
  --shell:240 5% 96%;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --background:240 10% 3.9%; --foreground:0 0% 98%;
    --card:240 8% 6%; --card-foreground:0 0% 98%;
    --popover:240 10% 3.9%;
    --primary:0 0% 98%; --primary-foreground:240 5.9% 10%;
    --secondary:240 3.7% 15.9%; --secondary-foreground:0 0% 98%;
    --muted:240 3.7% 15.9%; --muted-foreground:240 5% 64.9%;
    --accent:240 3.7% 15.9%; --accent-foreground:0 0% 98%;
    --destructive:0 63% 55%; --success:142 50% 52%; --warning:32 80% 60%; --info:213 80% 66%;
    --border:240 3.7% 15.9%; --input:240 3.7% 15.9%; --ring:240 4.9% 83.9%;
    --shell:240 10% 2.5%;
  }
}
:root[data-theme="dark"]{
  --background:240 10% 3.9%; --foreground:0 0% 98%;
  --card:240 8% 6%; --card-foreground:0 0% 98%;
  --popover:240 10% 3.9%;
  --primary:0 0% 98%; --primary-foreground:240 5.9% 10%;
  --secondary:240 3.7% 15.9%; --secondary-foreground:0 0% 98%;
  --muted:240 3.7% 15.9%; --muted-foreground:240 5% 64.9%;
  --accent:240 3.7% 15.9%; --accent-foreground:0 0% 98%;
  --destructive:0 63% 55%; --success:142 50% 52%; --warning:32 80% 60%; --info:213 80% 66%;
  --border:240 3.7% 15.9%; --input:240 3.7% 15.9%; --ring:240 4.9% 83.9%;
  --shell:240 10% 2.5%;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:hsl(var(--shell)); color:hsl(var(--foreground));
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}

/* ── layout ─────────────────────────────────────────── */
.app{display:grid; grid-template-columns:288px 1fr; height:100vh; overflow:hidden;}

.side{
  background:hsl(var(--card)); border-right:1px solid hsl(var(--border));
  display:flex; flex-direction:column; overflow:hidden;
}
.side-head{padding:20px 20px 16px; border-bottom:1px solid hsl(var(--border));}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.brand-mark{
  width:26px; height:26px; border-radius:6px; flex:none;
  background:hsl(var(--primary)); color:hsl(var(--primary-foreground));
  display:grid; place-items:center; font-weight:700; font-size:12px;
}
.brand-name{font-weight:600; letter-spacing:-.01em;}
.brand-sub{font-size:12px; color:hsl(var(--muted-foreground)); margin:0;}

.nav{flex:1; overflow-y:auto; padding:12px 12px 28px;}
.nav-zone{
  font-size:11px; font-weight:500; letter-spacing:.06em; text-transform:uppercase;
  color:hsl(var(--muted-foreground)); padding:14px 10px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:7px 10px; border-radius:calc(var(--radius) - 2px);
  border:0; background:transparent; color:hsl(var(--foreground));
  font:inherit; font-size:13.5px; cursor:pointer;
  transition:background .13s ease, color .13s ease;
}
.nav-item:hover{background:hsl(var(--accent));}
.nav-item[aria-current="true"]{background:hsl(var(--accent)); font-weight:500;}
.nav-item:focus-visible{outline:2px solid hsl(var(--ring)); outline-offset:-2px;}
.nav-item .rt{
  font-family:"JetBrains Mono",monospace; font-size:11.5px;
  color:hsl(var(--muted-foreground)); margin-left:auto; opacity:.75;
}
.nav-item[aria-current="true"] .rt{color:hsl(var(--foreground)); opacity:.9;}

/* ── main ───────────────────────────────────────────── */
.main{display:flex; flex-direction:column; overflow:hidden; padding:18px 18px 18px 0;}
.chrome{
  flex:1; display:flex; flex-direction:column; overflow:hidden;
  background:hsl(var(--background)); border:1px solid hsl(var(--border));
  border-radius:calc(var(--radius) + 4px);
  box-shadow:0 1px 2px hsl(var(--foreground)/.04), 0 18px 40px -28px hsl(var(--foreground)/.28);
}
.chrome-bar{
  display:flex; align-items:center; gap:12px; padding:10px 14px; flex:none;
  border-bottom:1px solid hsl(var(--border)); background:hsl(var(--muted)/.45);
  border-radius:calc(var(--radius) + 4px) calc(var(--radius) + 4px) 0 0;
}
.dots{display:flex; gap:6px;}
.dots i{width:10px; height:10px; border-radius:50%; background:hsl(var(--border)); display:block;}
.urlbar{
  flex:1; background:hsl(var(--background)); border:1px solid hsl(var(--border));
  border-radius:999px; padding:5px 14px; font-family:"JetBrains Mono",monospace;
  font-size:12px; color:hsl(var(--muted-foreground)); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.urlbar b{color:hsl(var(--foreground)); font-weight:500;}
.role-chip{
  font-size:11px; padding:3px 9px; border-radius:999px; flex:none;
  background:hsl(var(--secondary)); color:hsl(var(--secondary-foreground));
}
.viewport{flex:1; overflow-y:auto; overflow-x:hidden;}
.screen{padding:0; animation:in .22s cubic-bezier(.2,.6,.2,1);}
@keyframes in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* ── app shell inside the mock ──────────────────────── */
.topbar{
  display:flex; align-items:center; gap:14px; padding:12px 24px;
  border-bottom:1px solid hsl(var(--border)); position:sticky; top:0;
  background:hsl(var(--background)); z-index:5;
}
.topbar .logo{display:flex; align-items:center; gap:9px; font-weight:600; font-size:14px;}
.topbar nav{display:flex; gap:2px; margin-left:14px;}
.tab{
  padding:6px 11px; border-radius:calc(var(--radius) - 2px); font-size:13px;
  color:hsl(var(--muted-foreground));
}
.tab.on{background:hsl(var(--accent)); color:hsl(var(--foreground)); font-weight:500;}
.spacer{margin-left:auto;}
.avatar{
  width:28px; height:28px; border-radius:50%; background:hsl(var(--secondary));
  display:grid; place-items:center; font-size:11px; font-weight:600;
  color:hsl(var(--secondary-foreground));
}
.body{padding:26px 24px 44px; max-width:1180px;}
.body.narrow{max-width:760px;}

h1.pg{font-size:22px; font-weight:600; letter-spacing:-.02em; margin:0 0 4px;}
p.sub{color:hsl(var(--muted-foreground)); margin:0 0 22px; font-size:13.5px;}
h2.sec{font-size:15px; font-weight:600; margin:26px 0 12px;}

/* ── primitives ─────────────────────────────────────── */
.card{
  background:hsl(var(--card)); border:1px solid hsl(var(--border));
  border-radius:var(--radius); box-shadow:0 1px 2px hsl(var(--foreground)/.04);
}
.card-h{padding:16px 18px 12px; border-bottom:1px solid hsl(var(--border));}
.card-h h3{margin:0 0 2px; font-size:14.5px; font-weight:600;}
.card-h p{margin:0; font-size:12.5px; color:hsl(var(--muted-foreground));}
.card-b{padding:16px 18px;}
.card-f{padding:12px 18px; border-top:1px solid hsl(var(--border)); display:flex; gap:8px; align-items:center;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:34px; padding:0 14px; border-radius:calc(var(--radius) - 2px);
  border:1px solid transparent; font:inherit; font-size:13px; font-weight:500;
  cursor:pointer; transition:opacity .13s ease, background .13s ease, border-color .13s ease;
  white-space:nowrap;
}
.btn:focus-visible{outline:2px solid hsl(var(--ring)); outline-offset:2px;}
.btn-p{background:hsl(var(--primary)); color:hsl(var(--primary-foreground));}
.btn-p:hover{opacity:.9;}
.btn-o{background:transparent; border-color:hsl(var(--border)); color:hsl(var(--foreground));}
.btn-o:hover{background:hsl(var(--accent));}
.btn-g{background:transparent; color:hsl(var(--muted-foreground));}
.btn-g:hover{background:hsl(var(--accent)); color:hsl(var(--foreground));}
.btn-sm{height:28px; padding:0 10px; font-size:12px;}
.btn-lg{height:40px; padding:0 18px; font-size:14px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.inp{
  width:100%; height:36px; padding:0 11px; font:inherit; font-size:13.5px;
  background:hsl(var(--background)); color:hsl(var(--foreground));
  border:1px solid hsl(var(--input)); border-radius:calc(var(--radius) - 2px);
  transition:border-color .13s ease, box-shadow .13s ease;
}
.inp:focus{outline:0; border-color:hsl(var(--ring)); box-shadow:0 0 0 3px hsl(var(--ring)/.13);}
.inp::placeholder{color:hsl(var(--muted-foreground));}
.lbl{display:block; font-size:13px; font-weight:500; margin:0 0 6px;}
.field{margin-bottom:14px;}
.hint{font-size:12px; color:hsl(var(--muted-foreground)); margin:6px 0 0;}

.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500;
  padding:2px 8px; border-radius:999px; border:1px solid hsl(var(--border));
  background:hsl(var(--secondary)); color:hsl(var(--secondary-foreground)); white-space:nowrap;
}
.badge.ok{background:hsl(var(--success)/.12); color:hsl(var(--success)); border-color:hsl(var(--success)/.28);}
.badge.warn{background:hsl(var(--warning)/.12); color:hsl(var(--warning)); border-color:hsl(var(--warning)/.3);}
.badge.bad{background:hsl(var(--destructive)/.11); color:hsl(var(--destructive)); border-color:hsl(var(--destructive)/.28);}
.badge.info{background:hsl(var(--info)/.11); color:hsl(var(--info)); border-color:hsl(var(--info)/.28);}
.badge.dot::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

.sep{height:1px; background:hsl(var(--border)); border:0; margin:20px 0;}
.grid{display:grid; gap:14px;}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.row{display:flex; align-items:center; gap:10px;}
.mut{color:hsl(var(--muted-foreground));}
.tiny{font-size:12px;}
.num{font-variant-numeric:tabular-nums;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; font-size:11.5px; font-weight:500; text-transform:uppercase;
  letter-spacing:.05em; color:hsl(var(--muted-foreground));
  padding:0 12px 9px; border-bottom:1px solid hsl(var(--border));
}
td{padding:11px 12px; border-bottom:1px solid hsl(var(--border));}
tr:last-child td{border-bottom:0;}
.tbl-wrap{overflow-x:auto;}

.prog{height:6px; background:hsl(var(--muted)); border-radius:999px; overflow:hidden;}
.prog i{display:block; height:100%; background:hsl(var(--primary)); border-radius:999px;}

/* deal cards */
.deals{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px;}
.deal{
  background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:var(--radius);
  padding:15px 16px; cursor:pointer; transition:border-color .14s ease, box-shadow .14s ease, transform .14s ease;
}
.deal:hover{border-color:hsl(var(--foreground)/.24); box-shadow:0 6px 18px -12px hsl(var(--foreground)/.4); transform:translateY(-1px);}
.deal h4{margin:0 0 3px; font-size:14px; font-weight:600;}
.deal .ty{font-size:12px; color:hsl(var(--muted-foreground)); margin:0 0 14px;}
.deal .ft{display:flex; align-items:center; justify-content:space-between; margin-top:14px;}
.deal-new{
  border:1px dashed hsl(var(--border)); display:grid; place-items:center; min-height:132px;
  color:hsl(var(--muted-foreground)); gap:6px; text-align:center;
}
.deal-new:hover{border-color:hsl(var(--foreground)/.3); color:hsl(var(--foreground));}
.plus{width:30px; height:30px; border-radius:50%; background:hsl(var(--secondary)); display:grid; place-items:center; font-size:17px;}

/* slot board */
.slot{
  display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center;
  padding:12px 14px; border:1px solid hsl(var(--border)); border-radius:var(--radius);
  background:hsl(var(--card)); margin-bottom:8px;
}
.slot.doubt{border-color:hsl(var(--warning)/.5); background:hsl(var(--warning)/.045);}
.slot .nm{font-weight:500; font-size:13.5px;}
.slot .fl{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:hsl(var(--muted-foreground)); margin-top:3px;}
.slot .why{font-size:12px; color:hsl(var(--muted-foreground)); margin-top:5px;}

/* prose / review */
.prose{font-size:14.5px; line-height:1.72; max-width:70ch;}
.prose h3{font-size:15px; font-weight:600; margin:0 0 12px;}
.prose p{margin:0 0 14px;}
.cite{
  background:hsl(var(--info)/.11); color:hsl(var(--info)); border-radius:3px;
  padding:0 3px; cursor:pointer; border-bottom:1px dotted hsl(var(--info)/.6);
}
.ins{background:hsl(var(--success)/.14); color:hsl(var(--success)); text-decoration:none;}
.del{background:hsl(var(--destructive)/.11); color:hsl(var(--destructive)); text-decoration:line-through;}
.scaffold{
  border-left:2px solid hsl(var(--warning)); background:hsl(var(--warning)/.055);
  padding:12px 14px; border-radius:0 var(--radius) var(--radius) 0; margin:0 0 14px;
}
.scaffold .sh{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.scaffold .sl{color:hsl(var(--warning)); font-weight:500;}
.blank{
  display:inline-block; min-width:78px; border-bottom:1.5px dashed hsl(var(--warning)/.75);
  color:hsl(var(--warning)); font-size:13px;
}
.act{display:flex; gap:7px; margin-top:11px;}

.split{display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start;}
@media(max-width:1100px){.split{grid-template-columns:1fr;}}

.cmt{padding:12px 14px; border:1px solid hsl(var(--border)); border-radius:var(--radius); margin-bottom:10px; background:hsl(var(--card));}
.cmt .who{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.cmt .who .avatar{width:22px; height:22px; font-size:10px;}
.cmt p{margin:0; font-size:13px; color:hsl(var(--muted-foreground));}

.stepper{display:flex; align-items:center; gap:0; margin-bottom:30px;}
.step{display:flex; align-items:center; gap:8px; font-size:12.5px; color:hsl(var(--muted-foreground));}
.step .b{width:22px; height:22px; border-radius:50%; border:1px solid hsl(var(--border)); display:grid; place-items:center; font-size:11px; flex:none;}
.step.on{color:hsl(var(--foreground)); font-weight:500;}
.step.on .b{background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); border-color:transparent;}
.step.done .b{background:hsl(var(--success)/.16); color:hsl(var(--success)); border-color:hsl(var(--success)/.35);}
.step-line{flex:1; height:1px; background:hsl(var(--border)); margin:0 10px; min-width:16px;}

.auth-wrap{min-height:100%; display:grid; place-items:center; padding:56px 20px;}
.auth{width:100%; max-width:376px;}
.auth-logo{display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:22px; font-weight:600;}
.or{display:flex; align-items:center; gap:12px; margin:16px 0; color:hsl(var(--muted-foreground)); font-size:12px;}
.or::before,.or::after{content:""; flex:1; height:1px; background:hsl(var(--border));}

.wow{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:900px){.wow{grid-template-columns:1fr;}}
.wow-col{border:1px solid hsl(var(--border)); border-radius:var(--radius); overflow:hidden;}
.wow-col.mine{border-color:hsl(var(--success)/.45); box-shadow:0 0 0 3px hsl(var(--success)/.08);}
.wow-h{padding:10px 14px; border-bottom:1px solid hsl(var(--border)); font-size:12.5px; font-weight:500; background:hsl(var(--muted)/.4);}
.wow-b{padding:14px; font-size:13.2px; line-height:1.68; color:hsl(var(--muted-foreground));}
.wow-col.mine .wow-b{color:hsl(var(--foreground));}

.gr{display:grid; grid-template-columns:150px 1fr auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid hsl(var(--border));}
.gr:last-child{border-bottom:0;}
.kind{font-size:11.5px; font-weight:500; padding:3px 8px; border-radius:999px; background:hsl(var(--secondary)); justify-self:start;}

.empty{text-align:center; padding:64px 20px;}
.empty .ic{width:46px; height:46px; border-radius:50%; background:hsl(var(--muted)); display:grid; place-items:center; margin:0 auto 14px; font-size:20px;}
.empty h3{margin:0 0 6px; font-size:16px; font-weight:600;}
.empty p{margin:0 auto 18px; max-width:36ch; color:hsl(var(--muted-foreground)); font-size:13.5px;}

.note{
  display:flex; gap:10px; padding:11px 13px; border-radius:var(--radius); font-size:12.5px;
  background:hsl(var(--muted)/.6); border:1px solid hsl(var(--border)); color:hsl(var(--muted-foreground));
  margin-bottom:16px;
}
.note b{color:hsl(var(--foreground)); font-weight:500;}

.tl{position:relative; padding-left:22px;}
.tl::before{content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:hsl(var(--border));}
.tl-i{position:relative; padding:9px 0;}
.tl-i::before{content:""; position:absolute; left:-21px; top:15px; width:9px; height:9px; border-radius:50%; background:hsl(var(--border)); border:2px solid hsl(var(--background));}
.tl-i.hi::before{background:hsl(var(--success));}

/* ── cleaned nav ─────────────────────────────────── */
.nav-zone{
  font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:hsl(var(--muted-foreground)); padding:18px 10px 7px; display:flex; align-items:center; gap:8px;
}
.nav-zone::after{content:""; flex:1; height:1px; background:hsl(var(--border));}
.nav-item{align-items:flex-start; flex-direction:column; gap:1px; padding:6px 10px;}
.nav-item .lb{font-size:13px; line-height:1.35;}
.nav-item .rt{
  margin:0; font-size:10.5px; letter-spacing:-.01em; opacity:.8; line-height:1.3;
}
.nav-item.child{padding-left:24px; position:relative;}
.nav-item.child::before{
  content:""; position:absolute; left:13px; top:0; bottom:0; width:1px;
  background:hsl(var(--border));
}
.nav-item.child:last-of-type::before{bottom:50%;}
.nav-item.child::after{
  content:""; position:absolute; left:13px; top:14px; width:7px; height:1px;
  background:hsl(var(--border));
}
.nav-item.top{
  flex-direction:row; align-items:center; gap:9px; margin-bottom:4px;
  border:1px solid hsl(var(--border)); font-weight:500;
}
.nav-item.top .rt{margin-left:auto;}
.variants{display:flex; flex-wrap:wrap; gap:4px; padding:2px 10px 6px 24px;}
.vbtn{
  font-size:10.5px; padding:2px 7px; border-radius:999px; cursor:pointer;
  border:1px solid hsl(var(--border)); background:transparent;
  color:hsl(var(--muted-foreground)); font-family:inherit;
  transition:background .13s ease,color .13s ease;
}
.vbtn:hover{background:hsl(var(--accent)); color:hsl(var(--foreground));}
.vbtn[aria-current="true"]{background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); border-color:transparent;}

/* ── site-map diagram ────────────────────────────── */
.lane{display:grid; grid-template-columns:104px 1fr; gap:18px; align-items:start; padding:16px 0;}
.lane + .lane{border-top:1px solid hsl(var(--border));}
.lane-l{padding-top:6px;}
.lane-l .zn{font-size:12px; font-weight:600; letter-spacing:-.01em;}
.lane-l .zd{font-size:11px; color:hsl(var(--muted-foreground)); margin-top:2px; line-height:1.4;}
.flow{display:flex; flex-wrap:wrap; align-items:center; gap:7px;}
.node{
  border:1px solid hsl(var(--border)); border-radius:calc(var(--radius) - 2px);
  padding:7px 11px; background:hsl(var(--card)); cursor:pointer; min-width:0;
  transition:border-color .14s ease, transform .14s ease, box-shadow .14s ease;
}
.node:hover{border-color:hsl(var(--foreground)/.3); transform:translateY(-1px); box-shadow:0 5px 14px -10px hsl(var(--foreground)/.5);}
.node .nl{font-size:12.5px; font-weight:500; white-space:nowrap;}
.node .nr{font-family:"JetBrains Mono",monospace; font-size:10px; color:hsl(var(--muted-foreground)); white-space:nowrap;}
.node.key{border-color:hsl(var(--success)/.5); background:hsl(var(--success)/.06);}
.node.key .nl{color:hsl(var(--success));}
.node.land{border-color:hsl(var(--info)/.5); background:hsl(var(--info)/.06);}
.node.land .nl{color:hsl(var(--info));}
.arw{color:hsl(var(--muted-foreground)); font-size:13px; flex:none;}
.subgroup{
  border:1px dashed hsl(var(--border)); border-radius:var(--radius);
  padding:9px; display:flex; flex-wrap:wrap; gap:7px; align-items:center;
}
.subgroup .sgl{
  font-size:10px; text-transform:uppercase; letter-spacing:.07em;
  color:hsl(var(--muted-foreground)); width:100%; margin-bottom:2px;
}

/* ── explainers ──────────────────────────────────── */
.xp{border:1px solid hsl(var(--border)); border-radius:var(--radius); background:hsl(var(--card)); margin-bottom:10px; overflow:hidden;}
.xp-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px; padding:12px 16px; background:hsl(var(--muted)/.45); border-bottom:1px solid hsl(var(--border));}
.xp-h .r{font-family:"JetBrains Mono",monospace; font-size:12.5px; font-weight:500;}
.xp-h .n{font-weight:600; font-size:13.5px;}
.xp-b{padding:14px 16px;}
.xf{display:grid; grid-template-columns:78px 1fr; gap:14px; padding:7px 0;}
.xf + .xf{border-top:1px dashed hsl(var(--border));}
.xf .k{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:hsl(var(--muted-foreground)); padding-top:3px; font-family:"JetBrains Mono",monospace;}
.xf .v{font-size:13.2px; line-height:1.62;}
.xf .v ul{margin:0; padding-left:16px;} .xf .v li{margin-bottom:2px;}
@media(max-width:700px){.xf{grid-template-columns:1fr; gap:2px;}}

/* ── focus mode / workspace width ────────────────── */
.rail{
  display:flex; flex-direction:column; gap:3px; width:38px; flex:none;
  border-right:1px solid hsl(var(--border)); padding-right:10px; margin-right:16px;
}
.rail b{
  width:28px; height:28px; border-radius:calc(var(--radius) - 3px); display:grid; place-items:center;
  font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:500; cursor:pointer;
  color:hsl(var(--muted-foreground)); transition:background .13s ease;
}
.rail b:hover{background:hsl(var(--accent)); color:hsl(var(--foreground));}
.rail b.on{background:hsl(var(--primary)); color:hsl(var(--primary-foreground));}
.rail b.flag{box-shadow:inset 0 0 0 1px hsl(var(--warning)/.6);}
.work{display:flex; align-items:flex-start;}
.editor{flex:1; min-width:0;}
.panel{width:284px; flex:none; margin-left:18px;}
.measure{max-width:74ch;}

@media(max-width:1240px){.panel{display:none;}}

/* ── provenance popover ──────────────────────────── */
.pop{
  border:1px solid hsl(var(--border)); border-radius:var(--radius); background:hsl(var(--popover));
  box-shadow:0 10px 34px -14px hsl(var(--foreground)/.45); padding:0; overflow:hidden; max-width:400px;
}
.pop-h{padding:11px 14px; border-bottom:1px solid hsl(var(--border)); display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;}
.pop-h .v{font-weight:600; font-size:15px;}
.pop-h .path{font-family:"JetBrains Mono",monospace; font-size:11px; color:hsl(var(--muted-foreground));}
.pop-b{padding:12px 14px;}
.pop-b .formula{font-family:"JetBrains Mono",monospace; font-size:12px; color:hsl(var(--muted-foreground)); margin:0 0 10px;}
.pop-in{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 9px;
  border:1px solid hsl(var(--border)); border-radius:calc(var(--radius) - 3px); margin-bottom:6px;
  cursor:pointer; font-size:12.5px; transition:background .13s ease;
}
.pop-in:hover{background:hsl(var(--accent));}
.pop-in .p{font-family:"JetBrains Mono",monospace; font-size:11px; color:hsl(var(--muted-foreground));}
.quote{
  border-left:2px solid hsl(var(--border)); padding:2px 0 2px 11px; margin:9px 0 0;
  font-size:12.5px; color:hsl(var(--muted-foreground)); font-style:italic;
}
.crumb{font-size:11px; color:hsl(var(--muted-foreground)); padding:7px 14px; border-top:1px solid hsl(var(--border));}

/* ── figure slot ─────────────────────────────────── */
.figslot{
  border:1px dashed hsl(var(--border)); border-radius:var(--radius); padding:14px;
  display:flex; gap:13px; align-items:center; margin:0 0 14px;
}
.figthumb{
  width:78px; height:56px; border-radius:calc(var(--radius) - 3px); flex:none;
  background:hsl(var(--muted)); display:grid; place-items:center;
  color:hsl(var(--muted-foreground)); font-size:17px;
}
.figfilled{border-style:solid; background:hsl(var(--card));}

/* ── change notice ───────────────────────────────── */
.notice{
  border:1px solid hsl(var(--info)/.4); background:hsl(var(--info)/.07);
  border-radius:var(--radius); padding:12px 14px; margin:0 0 14px; font-size:13px;
}
.notice .t{font-weight:600; margin-bottom:4px;}
.notice .d{color:hsl(var(--muted-foreground)); margin-bottom:9px;}
.was{text-decoration:line-through; color:hsl(var(--muted-foreground));}
.now{color:hsl(var(--info)); font-weight:600;}

/* ── menu ────────────────────────────────────────── */
.menu{
  position:absolute; right:10px; top:34px; z-index:9; min-width:158px; padding:4px;
  background:hsl(var(--popover)); border:1px solid hsl(var(--border));
  border-radius:var(--radius); box-shadow:0 10px 30px -14px hsl(var(--foreground)/.5);
}
.menu b{
  display:block; padding:6px 9px; font-size:12.5px; font-weight:400; border-radius:5px; cursor:pointer;
}
.menu b:hover{background:hsl(var(--accent));}
.menu b.danger{color:hsl(var(--destructive));}
.menu hr{border:0; border-top:1px solid hsl(var(--border)); margin:4px 0;}
.dots-btn{
  position:absolute; right:8px; top:8px; width:24px; height:24px; border-radius:5px;
  display:grid; place-items:center; color:hsl(var(--muted-foreground)); font-size:15px;
}
.dots-btn:hover{background:hsl(var(--accent)); color:hsl(var(--foreground));}

/* ── journey bar ─────────────────────────────────── */
.jbar{
  display:flex; align-items:center; gap:14px; padding:9px 16px; flex:none;
  border-top:1px solid hsl(var(--border)); background:hsl(var(--muted)/.45);
  border-radius:0 0 calc(var(--radius) + 4px) calc(var(--radius) + 4px);
}
.jstep{font-size:12px; color:hsl(var(--muted-foreground)); min-width:0;}
.jstep b{color:hsl(var(--foreground)); font-weight:500;}
.jdots{display:flex; gap:4px; flex:1; justify-content:center; flex-wrap:wrap;}
.jdots i{
  width:6px; height:6px; border-radius:50%; background:hsl(var(--border));
  display:block; cursor:pointer; transition:background .15s ease, transform .15s ease;
}
.jdots i:hover{transform:scale(1.5);}
.jdots i.done{background:hsl(var(--muted-foreground));}
.jdots i.now{background:hsl(var(--primary)); transform:scale(1.6);}
.jnav{display:flex; gap:7px; flex:none;}
@media(max-width:860px){
  .app{grid-template-columns:1fr; height:auto;}
  .side{border-right:0; border-bottom:1px solid hsl(var(--border));}
  .nav{max-height:230px;}
  .main{padding:14px; height:auto;}
  .g3,.g2{grid-template-columns:1fr;}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>

<div class="app">

    <div class="side-head">

<script>
const S = {};
const shell = (tab, body) => `
  <div class="topbar">
    <div class="logo"><div class="brand-mark" style="width:22px;height:22px;font-size:10px;border-radius:5px">C</div> Acme Capital</div>

    <div class="spacer"></div>
    <button class="btn btn-o btn-sm">Search</button>
    <div class="avatar">JM</div>
  </div>${body}`;

const dealShell = (tab, body) => shell('deals', `
  <div class="body">
    <div class="row" style="margin-bottom:6px">
      <span class="tiny mut">Deals</span><span class="tiny mut">/</span>
      <span class="tiny" style="font-weight:500">Riverbend Rise</span>

    </div>
    <h1 class="pg">Riverbend Rise</h1>

    <div class="row" style="gap:2px;border-bottom:1px solid hsl(var(--border));margin-bottom:22px;padding-bottom:0">
      ${['Overview','Documents','Facts','Paper','Activity'].map(t=>
        `<span class="tab ${t.toLowerCase()===tab?'on':''}" style="border-radius:6px 6px 0 0;margin-bottom:-1px">${t}</span>`).join('')}

    ${body}

const auth = (title, sub, inner) => `
  <div class="auth-wrap"><div class="auth">

      <p class="sub" style="margin-bottom:20px">${sub}</p>
      ${inner}
    </div></div>
  </div></div>`;

/* ── PUBLIC ─────────────────────────────────────────── */
S['/signup'] = auth('Create an account','Two fields. Your firm is identified by your email domain.',`
  <button class="btn btn-o btn-block" style="height:38px">Continue with Microsoft</button>
  <button class="btn btn-o btn-block" style="height:38px;margin-top:8px">Continue with Google</button>
  <div class="or">or</div>
  <div class="field"><label class="lbl">Work email</label><input class="inp" placeholder="you@acmecapital.com.au"></div>

  <button class="btn btn-p btn-block" style="height:38px">Create account</button>
  <p class="hint" style="text-align:center;margin-top:14px">Already have an account? <b style="color:hsl(var(--foreground))">Sign in</b></p>`);

S['/signup#exists'] = auth('Create an account','Your firm already uses Creditpaper.',`
  <div class="note" style="background:hsl(var(--info)/.09);border-color:hsl(var(--info)/.3)">
    <div><b>Acme Capital already has an account.</b><br>
    Ask an administrator for access and they will approve it from their team settings.</div>
  </div>
  <button class="btn btn-p btn-block" style="height:38px">Request access</button>
  <button class="btn btn-g btn-block" style="margin-top:8px">Use a different email</button>`);

S['/login'] = auth('Sign in','Welcome back.',`
  <button class="btn btn-o btn-block" style="height:38px">Continue with Microsoft</button>
  <button class="btn btn-o btn-block" style="height:38px;margin-top:8px">Continue with Google</button>
  <div class="or">or</div>
  <div class="field"><label class="lbl">Email</label><input class="inp" value="jordan@acmecapital.com.au"></div>
  <div class="field">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <label class="lbl" style="margin:0">Password</label>
      <span class="tiny mut">Forgot?</span>
    </div>
    <input class="inp" type="password" placeholder="••••••••••">
  </div>
  <button class="btn btn-p btn-block" style="height:38px">Sign in</button>`);

S['/forgot'] = auth('Reset your password','We will email you a link.',`
  <div class="field"><label class="lbl">Email</label><input class="inp" placeholder="you@acmecapital.com.au"></div>
  <button class="btn btn-p btn-block" style="height:38px">Send reset link</button>
  <p class="hint" style="text-align:center;margin-top:14px">If an account exists for that address, a link is on its way.</p>`);

S['/reset'] = auth('Choose a new password','This link can be used once.',`
  <div class="field"><label class="lbl">New password</label><input class="inp" type="password" placeholder="••••••••••"></div>
  <div class="field"><label class="lbl">Confirm</label><input class="inp" type="password" placeholder="••••••••••"></div>
  <div class="note"><div>Signing in again will be required on your other devices.</div></div>
  <button class="btn btn-p btn-block" style="height:38px">Update password</button>`);

S['/verify'] = auth('Confirm your email','One step before we begin.',`
  <div class="note"><div>We sent a link to <b>jordan@acmecapital.com.au</b>. Open it to continue.</div></div>
  <button class="btn btn-o btn-block">Resend link <span class="mut" style="margin-left:4px">(0:42)</span></button>
  <p class="hint" style="text-align:center;margin-top:14px">Wrong address? <b style="color:hsl(var(--foreground))">Change it</b></p>`);

/* ── ONBOARDING ─────────────────────────────────────── */
const steps = (i) => `<div class="stepper">${
  ['Brand','Papers','Preview','Style','Plan'].map((n,x)=>
    `<div class="step ${x===i?'on':x<i?'done':''}"><span class="b">${x<i?'✓':x+1}</span>${n}</div>${x<4?'<div class="step-line"></div>':''}`
  ).join('')}</div>`;

const onb = (i, body) => `<div class="body narrow" style="padding-top:40px">${steps(i)}${body}</div>`;

S['/onboarding/brand'] = onb(0, `
  <h1 class="pg">Your brand</h1>
  <p class="sub">Taken from your website, so the papers look like yours from the start.</p>
  <div class="field"><label class="lbl">Website</label><input class="inp" value="acmecapital.com.au"></div>
  <div class="card" style="margin-top:18px">
    <div class="card-h"><div class="row" style="justify-content:space-between">
      <div><h3>Found</h3><p>Read in 9 seconds</p></div><span class="badge ok dot">complete</span>
    </div></div>
    <div class="card-b">
      <div class="grid g3">
        <div><p class="tiny mut" style="margin:0 0 7px">Palette</p><div class="row" style="gap:6px">
          ${['#123B57','#2E7D74','#C8A45C','#E8EBEC'].map(c=>`<span style="width:26px;height:26px;border-radius:6px;background:${c};border:1px solid hsl(var(--border))"></span>`).join('')}
        </div></div>
        <div><p class="tiny mut" style="margin:0 0 7px">Typeface</p><div style="font-size:17px;font-weight:600">Söhne</div></div>
        <div><p class="tiny mut" style="margin:0 0 7px">Logo</p><div class="row"><div class="brand-mark" style="background:#123B57;color:#fff">A</div><span class="tiny">acme-mark.svg</span></div></div>
      </div>
      <hr class="sep">
      <p class="tiny mut" style="margin:0 0 8px">Words you use</p>
      <div class="row" style="flex-wrap:wrap;gap:6px">
        ${['facility','sponsor','security','drawdown','residual stock'].map(t=>`<span class="badge">${t}</span>`).join('')}
      </div>
      <div class="note" style="margin:16px 0 0">
        <div><b>Look and vocabulary only.</b> Nothing from your website affects how a paper is written — marketing language has no place in a credit document.</div>
      </div>
    </div>
    <div class="card-f"><button class="btn btn-p">Looks right, continue</button><button class="btn btn-g">Adjust</button></div>
  </div>`);

S['/onboarding/papers'] = onb(1, `
  <h1 class="pg">Teach it your voice</h1>
  <p class="sub">Two or three papers your credit committee already approved. They set the standard.</p>
  <div class="card"><div class="card-b" style="padding:0">
    <div style="border:1px dashed hsl(var(--border));border-radius:var(--radius);margin:16px;padding:34px;text-align:center">
      <div class="plus" style="margin:0 auto 10px">↑</div>
      <div style="font-weight:500;margin-bottom:3px">Drop signed credit papers here</div>
      <p class="tiny mut" style="margin:0">PDF or Word · 2–3 is enough</p>
    </div>
    <div style="padding:0 16px 16px">
      ${[['Credit Paper — Harbour Lane.pdf','Read · structure and voice learned','ok'],
         ['Credit Paper — Kingsford Yard.pdf','Read · structure and voice learned','ok'],
         ['Credit Paper — Maple Row.pdf','Reading…','info']].map(([n,s,k])=>`
        <div class="slot"><div><div class="nm">${n}</div><div class="why">${s}</div></div><span class="badge ${k} dot">${k==='ok'?'done':'working'}</span></div>`).join('')}
    </div>
  </div></div>
  <div class="note" style="margin-top:16px"><div><b>Private to Acme Capital.</b> Never used for any other firm, and deletable at any time.</div></div>
  <div class="row" style="margin-top:18px"><button class="btn btn-p">Continue</button><button class="btn btn-g">I don't have any yet</button></div>`);

S['/onboarding/preview'] = onb(2, `
  <h1 class="pg">This is your voice</h1>
  <p class="sub">The same deal summary, written two ways. On the right is yours.</p>
  <div class="wow">
    <div class="wow-col"><div class="wow-h mut">Generic</div><div class="wow-b">
      The borrower is requesting a construction facility of $7,758,697 for a project located in the metropolitan area. The loan-to-value ratio is 44.93%. The valuation was completed recently. The sponsor has experience in property development. Security will be a first mortgage.
    </div></div>
    <div class="wow-col mine">
      <div class="wow-h"><span class="row" style="gap:7px">Acme Capital <span class="badge ok" style="font-size:10.5px">your voice</span></span></div>
      <div class="wow-b">
        Acme is providing a $7,758,697 construction facility to fund two dwellings, against sponsor equity of $7,192,568 — a near 50/50 split of total project cost. The facility binds against both leverage covenants at funding with negligible headroom: the LVR sits at 44.93% against a 45% ceiling, $12,803 of room. Both are analysed in full below; the point for this summary is that the deal carries no cushion on either constraint at day one.
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:18px"><div class="card-b">
    <p class="tiny mut" style="margin:0 0 9px">Learned from your three papers</p>
    <div class="row" style="flex-wrap:wrap;gap:6px">
      ${['leads with the structure','quantifies headroom','flags tension early','no promotional language','your section order'].map(t=>`<span class="badge">${t}</span>`).join('')}
    </div>
  </div></div>
  <div class="row" style="margin-top:18px"><button class="btn btn-p btn-lg">Continue</button><span class="tiny mut">Written on a sample deal — none of your data needed yet.</span></div>`);

S['/onboarding/profile'] = onb(3, `
  <h1 class="pg">Confirm your house style</h1>
  <p class="sub">Everything here is editable. Nothing is your house style until you say so.</p>
  <div class="card"><div class="card-b">
    <div class="field"><label class="lbl">Register</label><input class="inp" value="Institutional credit-committee; third person"></div>
    <div class="field"><label class="lbl">Paper title</label><input class="inp" value="Internal Credit Memorandum"></div>

  <div class="card-f"><button class="btn btn-p">Confirm</button><button class="btn btn-g">Reset to learned</button></div></div>`);

S['/onboarding/plan'] = onb(4, `
  <h1 class="pg">Add a payment method</h1>
  <p class="sub">Your first paper is on us. Nothing is charged today.</p>
  <div class="grid g3" style="margin-bottom:16px">
    ${[['Starter','3 papers','$499','',''],
       ['Standard','8 papers','$999','Most lenders','on'],
       ['Enterprise','Unlimited','By quote','','']].map(([n,v,pr,tag,sel])=>`

    <p class="hint" style="text-align:center;margin-top:12px">Charged only when your second paper is approved.</p>
  </div></div>`);

/* ── APP ────────────────────────────────────────────── */
const DEALS = [
  ['Riverbend Rise','Construction · $7.76m','in review','info','2 hours ago',null,'5 of 9 sections approved'],

   job:'Personal settings, distinct from the firm\u2019s.',
   contains:['Name, email, password change','Sign out of other sessions'],
   states:'Default · saving · saved', note:'—'}]},
];

const ALL = Z.flatMap(z => z.pages);

/* ── nav ────────────────────────────────────────────── */
const nav = document.getElementById('nav');
const vp = document.getElementById('vp');
const url = document.getElementById('url');
const role = document.getElementById('role');

Z.forEach(z => {
  if (z.zone !== 'Start') {
    const h = document.createElement('div');
    h.className = 'nav-zone'; h.textContent = z.zone; nav.appendChild(h);
  }
  z.pages.forEach(pg => {
    const key = pg.screen || pg.route;
    const b = document.createElement('button');
    b.className = 'nav-item' + (pg.child ? ' child' : '') + (pg.top ? ' top' : '');
    b.dataset.route = key;
    b.innerHTML = pg.top
      ? `<span class="lb">${pg.label}</span><span class="rt">start here</span>`
      : `<span class="lb">${pg.label}</span><span class="rt mono">${pg.route}</span>`;
    b.addEventListener('click', () => go(key));
    nav.appendChild(b);
    if (pg.variants) {
      const w = document.createElement('div');
      w.className = 'variants';
      pg.variants.forEach(v => {
        const vb = document.createElement('button');
        vb.className = 'vbtn'; vb.dataset.route = v.k; vb.textContent = v.l;
        vb.addEventListener('click', () => go(v.k));
        w.appendChild(vb);
      });
      nav.appendChild(w);
    }
  });
});

/* ── the journey: what a new customer actually does ── */
const JOURNEY = [
  ['/signup',                        'Sign up with a work email'],
  ['/verify',                        'Confirm the email address'],
  ['/onboarding/brand',              'Their brand, read from their website'],
  ['/onboarding/papers',             'Upload two or three signed papers'],
  ['/onboarding/preview',            'The wow \u2014 a section in their own voice'],
  ['/onboarding/profile',            'Confirm the house style'],
  ['/onboarding/plan',               'Add a card. First paper free'],
  ['/#empty',                        'Land on an empty workspace'],
  ['/deals/new',                     'Create the first deal'],
  ['/deals/:dealId/documents',       'Drop the folder, confirm the mapping'],
  ['/deals/:dealId',                 'Watch it extract, see what needs them'],
  ['/deals/:dealId/facts',           'Check the facts and their sources'],
  ['/deals/:dealId/paper',           'Generate the paper'],
  ['/deals/:dealId/paper/:section',  'Review, redline, accept the scaffold'],
  ['/deals/:dealId/activity',        'The audit trail behind it all'],
  ['/',                              'Back to a working portfolio'],
  ['/settings/guardrails',           'Teach it the firm\u2019s rules'],
  ['/settings/billing',              'Tier, papers used, invoices'],
];
const jstep = document.getElementById('jstep');
const jdots = document.getElementById('jdots');
let ji = 0;

JOURNEY.forEach((_, i) => {
  const d = document.createElement('i');
  d.addEventListener('click', () => go(JOURNEY[i][0]));
  jdots.appendChild(d);
});

document.getElementById('jprev').addEventListener('click', () => {
  if (ji > 0) go(JOURNEY[ji - 1][0]);
});
document.getElementById('jnext').addEventListener('click', () => {
  if (ji < JOURNEY.length - 1) go(JOURNEY[ji + 1][0]);
});

function go(route) {
  document.querySelectorAll('.nav-item,.vbtn').forEach(n =>
    n.setAttribute('aria-current', String(n.dataset.route === route)));

  const clean = route.split('#')[0];
  url.innerHTML = `app.creditpaper.com<b>${clean}</b>`;
  const pub = /^\/(signup|login|forgot|reset|verify)/.test(clean);
  role.textContent = pub ? 'signed out'
    : (clean.startsWith('/onboarding') ? 'onboarding' : 'credit officer');

  vp.innerHTML = `<div class="screen">${S[route] || '<div class="empty"><h3>Not mocked</h3></div>'}</div>`;

  // explicit jumps declared in a screen
  vp.querySelectorAll('[data-go]').forEach(el =>
    el.addEventListener('click', () => go(el.dataset.go)));

  // journey position
  const at = JOURNEY.findIndex(j => j[0] === route);
  if (at > -1) ji = at;
  jstep.innerHTML = at > -1
    ? `<b>Step ${at + 1} of ${JOURNEY.length}</b> &middot; ${JOURNEY[at][1]}`
    : `<b>Off the main path</b> &middot; ${route}`;
  [...jdots.children].forEach((d, i) =>
    d.className = i === ji ? 'now' : (i < ji ? 'done' : ''));
  document.getElementById('jprev').disabled = ji === 0;
  document.getElementById('jnext').disabled = ji >= JOURNEY.length - 1;

  // the primary action on a screen carries the journey forward
  if (at > -1 && at < JOURNEY.length - 1) {
    const cta = vp.querySelector('.btn-p:not([data-go])');
    if (cta) cta.addEventListener('click', () => go(JOURNEY[at + 1][0]));
  }

  vp.scrollTop = 0;
}
go(JOURNEY[0][0]);
</script>

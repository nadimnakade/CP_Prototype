<!DOCTYPE html>
<html lang="en">
<head>

<title>New Deal — CreditPaper</title>
<link rel="stylesheet" href="theme.css">

<div class="app">
  <aside class="text-sidebar">
    <div class="brand"><div class="brand-mark">C</div><div class="brand-name">CREDITPAPER</div></div>
    <div class="nav">
      <a class="nav-item" href="#"><svg class="ico"><use href="#i-home"/></svg> Dashboard</a>
      <a class="nav-item active" href="11-deals.html"><svg class="ico"><use href="#i-grid"/></svg> Deals</a>
      <a class="nav-item" href="#"><svg class="ico"><use href="#i-file"/></svg> Credit Papers</a>
      <a class="nav-item" href="#"><svg class="ico"><use href="#i-layers"/></svg> Templates</a>
      <a class="nav-item" href="#"><svg class="ico"><use href="#i-db"/></svg> Data Rooms</a>
      <a class="nav-item" href="#"><svg class="ico"><use href="#i-clipboard"/></svg> Reports</a>
      <a class="nav-item" href="#"><svg class="ico"><use href="#i-activity"/></svg> Activity</a>
    </div>
    <div class="sidebar-user" style="margin-bottom:12px;margin-left:10px;margin-right:10px"><div class="av sm">JS</div><div class="who" style="min-width:0"><div class="nm" style="font-size:12px;font-weight:600">Jordan Smith</div><div class="em" style="font-size:10px;color:var(--text-3)">Admin</div></div></div>
  </aside>

  <div class="main">
    <div class="header-bar">
      <div class="crumb"><span style="color:var(--text);font-weight:600">Deals</span><span style="margin:0 4px;color:var(--text-4)">›</span><span style="color:var(--text-3)">New Deal</span></div>
    </div>
    <div class="canvas" style="max-width:520px;overflow:auto">
      <div style="display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4);margin-bottom:2px"><span style="width:15px;height:2px;background:var(--accent);border-radius:2px;display:block"></span> New Deal</div>
      <h1 class="page-title">New deal</h1>
      <p class="page-sub">Two fields. Everything else can wait.</p>
      <div class="card">
        <div class="card-body">
          <div class="field" style="margin-bottom:16px"><label class="label">Deal name</label><input class="input" placeholder="Riverbend Rise"></div>
          <div class="field"><label class="label">Deal type</label>
            <div class="grid g-3" style="gap:8px">
              <div class="type-card selected"><div style="font-weight:600;font-size:12.5px">Construction</div></div>
              <div class="type-card"><div style="font-weight:600;font-size:12.5px">Bridge</div></div>
              <div class="type-card"><div style="font-weight:600;font-size:12.5px">Residual stock</div></div>
            </div>
            <div style="font-size:10.5px;color:var(--text-3);margin-top:6px">Determines which documents the deal needs.</div>
          </div>
        </div>
        <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px">
          <a href="13-deal-overview.html" class="btn btn-primary btn-sm">Create and add documents</a>
          <a href="11-deals.html" class="btn btn-sm">Cancel</a>
        </div>
      </div>
    </div>
  </div>

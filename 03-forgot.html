<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — CreditPaper</title>
<link rel="stylesheet" href="theme.css">
<style>
  .auth-page { min-height:100vh; display:grid; place-items:center; padding:40px 20px; background:var(--page); }
  .auth-card { width:100%; max-width:380px; }
  .auth-logo { display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:24px; }
  .auth-logo .brand-mark { width:30px; height:30px; font-size:14px; }
  .auth-logo .brand-name { font-size:16px; letter-spacing:-.3px; }
  .auth-title { font-size:18px; font-weight:700; margin:0 0 4px; text-align:center; }
  .auth-sub { font-size:12.5px; color:var(--text-3); text-align:center; margin:0 0 22px; }
  .auth-note { font-size:11.5px; color:var(--text-3); text-align:center; margin-top:14px; }
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><div class="brand-mark">C</div><div class="brand-name">CREDITPAPER</div></div>
    <div class="card">
      <div class="card-body" style="padding:24px">
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-sub">We will email you a link.</p>
        <div class="field" style="margin-bottom:18px">
          <label class="label">Email</label>
          <input class="input" placeholder="you@acmecapital.com.au">
        </div>
        <button class="btn btn-primary" style="width:100%;height:38px;justify-content:center">Send reset link</button>
        <p class="auth-note">If an account exists for that address, a link is on its way.</p>
        <p class="auth-note" style="margin-top:0">Remember your password? <b style="color:var(--accent-hover);cursor:pointer" onclick="location.href='02-login.html'">Sign in</b></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — CreditPaper</title>
<link rel="stylesheet" href="theme.css">
<style>
  .auth-note { font-size: 11.5px; color: var(--text-3); text-align: center; margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-left">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-mark">C</div>
        <div class="brand-name">CREDITPAPER</div>
      </div>

      <div class="card" style="box-shadow: var(--sh-3)">
        <div class="card-body" style="padding:28px">
          <h1 class="auth-title">Reset your password</h1>
          <p class="auth-sub">Enter your email and we'll send a reset link.</p>

          <div class="field" style="margin-bottom:20px">
            <label class="label">Email</label>
            <input class="input" placeholder="you@acmecapital.com.au">
          </div>

          <button class="btn btn-primary" style="width:100%;height:40px;justify-content:center">
            Send reset link
          </button>

          <p class="auth-note">If an account exists for that address, a link is on its way.</p>
          <p class="auth-note" style="margin-top:0">Remember your password? <b style="color:var(--accent-hover);cursor:pointer;font-weight:600" onclick="location.href='02-login.html'">Sign in</b></p>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-right-content">
      <h2>Don't worry,<br>it happens.</h2>
      <p>We'll get you back into your account in no time. Check your inbox for the reset link.</p>
    </div>
  </div>
</div>

</body>
</html>

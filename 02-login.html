<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — CreditPaper</title>
<link rel="stylesheet" href="theme.css">
<style>
  .field-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .field-row .label { margin: 0; }
  .forgot { font-size: 11.5px; color: var(--text-3); cursor: pointer; font-weight: 500; transition: color var(--dur-fast); }
  .forgot:hover { color: var(--accent-hover); }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-left">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-mark">C</div>
        <div class="brand-name">CREDITPAPER</div>
      </div>

      <div class="card" style="box-shadow: var(--sh-3)">
        <div class="card-body" style="padding:28px">
          <h1 class="auth-title">Sign in</h1>
          <p class="auth-sub">Welcome back. Enter your credentials to continue.</p>

          <button class="sso-btn">
            <svg viewBox="0 0 21 21"><path d="M0 0h10v10H0z" fill="#F25022"/><path d="M11 0h10v10H11z" fill="#7FBA00"/><path d="M0 11h10v10H0z" fill="#00A4EF"/><path d="M11 11h10v10H11z" fill="#FFB900"/></svg>
            Continue with Microsoft
          </button>
          <button class="sso-btn" style="margin-top:10px">
            <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </button>

          <div class="auth-divider">or</div>

          <div class="field" style="margin-bottom:16px">
            <label class="label">Email</label>
            <input class="input" value="jordan@acmecapital.com.au">
          </div>
          <div style="margin-bottom:20px">
            <div class="field-row">
              <label class="label">Password</label>
              <span class="forgot" onclick="location.href='03-forgot.html'">Forgot?</span>
            </div>
            <input class="input" type="password" placeholder="Enter your password" style="margin-top:6px">
          </div>

          <button class="btn btn-primary" style="width:100%;height:40px;justify-content:center">
            Sign in
          </button>

          <p class="auth-link" style="margin-top:16px">Don't have an account? <b onclick="location.href='01-signup.html'">Sign up</b></p>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-right-content">
      <h2>Welcome back to<br>CreditPaper.</h2>
      <p>Pick up exactly where you left off. Your deals, papers, and team are all here.</p>
    </div>
  </div>
</div>

</body>
</html>

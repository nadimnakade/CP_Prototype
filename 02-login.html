<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — CreditPaper</title>
<link rel="stylesheet" href="theme.css">
<style>
  .auth-page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: var(--page);
  }
  .auth-card { width: 100%; max-width: 380px; }
  .auth-logo {
    display: flex; align-items: center; justify-content: center;
    gap: 9px; margin-bottom: 24px;
  }
  .auth-logo .brand-mark { width: 30px; height: 30px; font-size: 14px; }
  .auth-logo .brand-name { font-size: 16px; letter-spacing: -.3px; }
  .auth-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; text-align: center; }
  .auth-sub { font-size: 12.5px; color: var(--text-3); text-align: center; margin: 0 0 22px; }
  .auth-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 16px 0; font-size: 11px; color: var(--text-4);
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .auth-link {
    text-align: center; margin-top: 16px; font-size: 12px; color: var(--text-3);
  }
  .auth-link b { color: var(--accent-hover); font-weight: 600; cursor: pointer; }
  .sso-btn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; height: 38px; border-radius: var(--r-sm);
    border: 1px solid var(--border-2); background: var(--surface);
    color: var(--text); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .sso-btn:hover { border-color: var(--border-strong); }
  .sso-btn svg { width: 16px; height: 16px; }
  .field-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .field-row .label { margin: 0; }
  .forgot { font-size: 11.5px; color: var(--text-3); cursor: pointer; font-weight: 500; }
  .forgot:hover { color: var(--accent-hover); }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-mark">C</div>
      <div class="brand-name">CREDITPAPER</div>
    </div>
    <div class="card">
      <div class="card-body" style="padding:24px">
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-sub">Welcome back.</p>

        <button class="sso-btn">
          <svg viewBox="0 0 21 21"><path d="M0 0h10v10H0z" fill="#F25022"/><path d="M11 0h10v10H11z" fill="#7FBA00"/><path d="M0 11h10v10H0z" fill="#00A4EF"/><path d="M11 11h10v10H11z" fill="#FFB900"/></svg>
          Continue with Microsoft
        </button>
        <button class="sso-btn" style="margin-top:8px">
          <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>

        <div class="auth-divider">or</div>

        <div class="field" style="margin-bottom:14px">
          <label class="label">Email</label>
          <input class="input" value="jordan@acmecapital.com.au">
        </div>
        <div style="margin-bottom:18px">
          <div class="field-row">
            <label class="label">Password</label>
            <span class="forgot">Forgot?</span>
          </div>
          <input class="input" type="password" placeholder="••••••••••" style="margin-top:6px">
        </div>

        <button class="btn btn-primary" style="width:100%;height:38px;justify-content:center">
          Sign in
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
